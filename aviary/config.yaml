name: Aviary
version: "0.2.4"
slug: aviary
description: Aggregate bird detections from Frigate and BirdNET-Go with analytics and clip preview
url: https://github.com/chasem12345/HASS-Aviary/tree/main/aviary
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:bird
panel_title: Aviary
panel_admin: false
map:
  - data:rw
services:
  - mqtt:want
options:
  frigate_url: "http://ccab4aaf-frigate:5000"
  birdnet_url: "http://a0d7b954-birdnet-go:8080"
  frigate_topic: "frigate/events"
  birdnet_topic: "birdnet"
  backfill_on_start: true
  ignore_unclassified: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  log_level: "info"
schema:
  frigate_url: "url"
  birdnet_url: "url"
  frigate_topic: "str"
  birdnet_topic: "str"
  backfill_on_start: "bool"
  ignore_unclassified: "bool"
  mqtt_host: "str?"
  mqtt_port: "port"
  mqtt_user: "str?"
  mqtt_password: "password?"
  log_level: "list(debug|info|warning|error)"
