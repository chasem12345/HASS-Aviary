name: Aviary
version: "0.4.2"
slug: aviary
description: Aggregate bird detections from Frigate and BirdNET-Go with analytics and clip preview
url: https://github.com/chasem12345/HASS-Aviary/tree/main/aviary
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:bird
panel_title: Aviary
panel_admin: false
# homeassistant_config is used to stage notification images under www/ and to
# auto-install the notification blueprint. Pin the mount point explicitly (the
# Supervisor default is /homeassistant) so the app never guesses wrong.
map:
  - type: data
    read_only: false
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
# Core API proxy (http://supervisor/core/api) — used to fire detection events.
homeassistant_api: true
# Supervisor API — used only to look up this add-on's own slug (/addons/self/info)
# so notification tap actions can open the Aviary panel.
hassio_api: true
services:
  - mqtt:want
options:
  frigate_url: "http://ccab4aaf-frigate:5000"
  birdnet_url: "http://a0d7b954-birdnet-go:8080"
  frigate_topic: "frigate/events"
  birdnet_topic: "birdnet"
  backfill_on_start: true
  ignore_unclassified: true
  notify_new_species: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  log_level: "info"
schema:
  frigate_url: "url"
  birdnet_url: "url"
  frigate_topic: "str"
  birdnet_topic: "str"
  backfill_on_start: "bool"
  ignore_unclassified: "bool"
  notify_new_species: "bool"
  mqtt_host: "str?"
  mqtt_port: "port"
  mqtt_user: "str?"
  mqtt_password: "password?"
  log_level: "list(debug|info|warning|error)"
