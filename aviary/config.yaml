name: Aviary
version: "0.19.0"
slug: aviary
description: Aggregate bird detections from Frigate and BirdNET-Go with analytics and clip preview
url: https://github.com/chasem12345/HASS-Aviary/tree/main/aviary
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:bird
panel_title: Aviary
panel_admin: false
# homeassistant_config is used to stage notification images under www/ and to
# auto-install the notification blueprint. Pin the mount point explicitly (the
# Supervisor default is /homeassistant) so the app never guesses wrong.
map:
  - type: data
    read_only: false
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
# Core API proxy (http://supervisor/core/api) — used to fire detection events.
homeassistant_api: true
# Supervisor API — used only to look up this add-on's own slug (/addons/self/info)
# so notification tap actions can open the Aviary panel.
hassio_api: true
services:
  - mqtt:want
options:
  frigate_url: "http://ccab4aaf-frigate:5000"
  birdnet_url: "http://a0d7b954-birdnet-go:8080"
  frigate_topic: "frigate/events"
  birdnet_topic: "birdnet"
  backfill_on_start: true
  ignore_unclassified: true
  ignore_cameras: []
  require_species_confirmation: true
  notify_new_species: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  xeno_canto_api_key: ""
  identify_url: ""
  identify_token: ""
  identify_enabled: false
  identify_min_score: 0.35
  identify_min_margin: 0.08
  identify_workers: 2
  identify_timeout: 60
  identify_retain_days: 14
  identify_use_audio_priors: true
  identify_exclude_blacklisted: true
  identify_zoom_map: []
  identify_zoom_start_offset: 2.0
  identify_zoom_zone_priority: []
  log_level: "info"
schema:
  frigate_url: "url"
  birdnet_url: "url"
  frigate_topic: "str"
  birdnet_topic: "str"
  backfill_on_start: "bool"
  ignore_unclassified: "bool"
  # Frigate camera names whose detections are never recorded (e.g. a wide zone-detection
  # camera whose classifications aren't trustworthy). Empty records every camera.
  ignore_cameras:
    - "str"
  # New species wait in a review queue instead of joining the registry automatically.
  require_species_confirmation: "bool"
  notify_new_species: "bool"
  mqtt_host: "str?"
  mqtt_port: "port"
  mqtt_user: "str?"
  mqtt_password: "password?"
  # Free key from https://xeno-canto.org/account. Optional: without it, reference
  # recordings come from iNaturalist observations as before.
  xeno_canto_api_key: "password?"
  # --- External identification (the aviary-id companion container) -------------
  # Base URL of the aviary-id service, e.g. http://10.0.0.50:8100. It runs on a
  # separate host with a GPU and pulls clips from Frigate itself, so that host needs
  # to reach Frigate — Aviary only sends it the event id.
  identify_url: "url?"
  # Shared secret sent as `Authorization: Bearer ...`; must match AVIARY_ID_TOKEN on
  # the service. Blank means the service is not checking (fine on a trusted LAN).
  identify_token: "password?"
  # With this on, Frigate's own bird classification should be turned OFF: Aviary
  # takes over species identification entirely and only needs Frigate's `bird`
  # object detection.
  identify_enabled: "bool"
  # Below this fused top-1 probability, a result is treated as unidentified and goes
  # to the review queue instead of the registry.
  identify_min_score: "float(0.0,1.0)"
  # Minimum gap between the top two species. A high score with a tiny margin is two
  # confusable birds (Downy vs. Hairy Woodpecker), not a confident answer.
  identify_min_margin: "float(0.0,1.0)"
  # Concurrent identification requests. The service serializes GPU work anyway, so
  # more than a few only deepens the queue.
  identify_workers: "int(1,8)"
  identify_timeout: "int(5,600)"
  # Unidentified detections are kept for review rather than dropped, then purged
  # after this many days so a busy feeder can't grow the database without bound.
  # 0 keeps them forever.
  identify_retain_days: "int(0,365)"
  # Bias identification toward species BirdNET-Go heard on the microphone around the
  # same time. Costs nothing and uses data Aviary already has.
  identify_use_audio_priors: "bool"
  # Rule blacklisted species out of the identifier's candidate list entirely, so a bird
  # it would have misread as one gets named correctly instead of being discarded. Right
  # when you blacklisted a species because it does not occur here. WRONG if you
  # blacklisted one that genuinely visits and you simply don't want recorded — every
  # visit would then be recorded as some other species. Turn off in that case.
  identify_exclude_blacklisted: "bool"
  # --- Cross-camera zoom --------------------------------------------------------
  # "detect_camera:ptz_camera" pairs. When an event's camera appears on the left, the
  # identification service classifies the RIGHT camera's recordings for the event's time
  # window instead of the event clip — for setups where a wide camera runs detection and
  # a record-only PTZ camera (steered by your automation) holds the zoomed view. The
  # PTZ camera must be recording continuously in Frigate. e.g. ["birdzone:bird"]
  identify_zoom_map:
    - "str"
  # Seconds trimmed from the start of the zoom window, covering PTZ travel time so a
  # leftover view of the previous target is not classified.
  identify_zoom_start_offset: "float(0.0,30.0)"
  # Your PTZ automation's zone priority list, highest first. With two birds in different
  # zones at once, the PTZ parks on the higher-priority zone — so the lower-priority
  # event skips the zoomed footage (it would show the wrong bird) and classifies from
  # its own camera's media. Zones not listed rank below all listed ones. Empty = always
  # use the zoomed footage.
  identify_zoom_zone_priority:
    - "str"
  log_level: "list(debug|info|warning|error)"
