name: Aviary
version: "0.38.0"
slug: aviary
description: Aggregate bird detections from Frigate and BirdNET-Go with analytics and clip preview
url: https://github.com/chasem12345/HASS-Aviary/tree/main/aviary
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:bird
panel_title: Aviary
panel_admin: false
# homeassistant_config is used to stage notification images under www/ and to
# auto-install the notification blueprint. Pin the mount point explicitly (the
# Supervisor default is /homeassistant) so the app never guesses wrong.
map:
  - type: data
    read_only: false
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
# Core API proxy (http://supervisor/core/api) — used to fire detection events.
homeassistant_api: true
# Supervisor API — used only to look up this add-on's own slug (/addons/self/info)
# so notification tap actions can open the Aviary panel.
hassio_api: true
services:
  - mqtt:want
options:
  frigate_url: "http://ccab4aaf-frigate:5000"
  birdnet_url: "http://a0d7b954-birdnet-go:8080"
  frigate_topic: "frigate/events"
  frigate_review_topic: "frigate/reviews"
  birdnet_topic: "birdnet"
  backfill_on_start: true
  ignore_unclassified: true
  ignore_cameras: []
  require_species_confirmation: true
  notify_new_species: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  xeno_canto_api_key: ""
  identify_url: ""
  identify_token: ""
  identify_enabled: false
  identify_min_score: 0.35
  identify_min_margin: 0.08
  identify_workers: 2
  identify_timeout: 60
  identify_retain_days: 14
  identify_use_audio_priors: true
  identify_exclude_blacklisted: true
  identify_learn_from_auto: false
  identify_not_bird_similarity: 0.9
  identify_confirm_frigate: true
  identify_visit_context: true
  identify_visit_window_s: 20.0
  frigate_object_update_topic: ""
  identify_zoom_map: []
  identify_zoom_start_offset: 2.0
  identify_zoom_zone_priority: []
  clip_pad_seconds: 10.0
  keepsakes: true
  keepsake_video: true
  birdnet_clean_preset: "smooth"
  birdnet_clean_filter: ""
  inat_app_id: ""
  inat_app_secret: ""
  inat_username: ""
  inat_password: ""
  inat_auto_post: false
  inat_geoprivacy: "obscured"
  inat_positional_accuracy_m: 30
  ha_stats: true
  ha_stats_window_days: 30
  ha_stats_recent_days: 7
  ha_stats_zone_memory_s: 90
  mqtt_discovery_prefix: "homeassistant"
  log_level: "info"
schema:
  frigate_url: "url"
  birdnet_url: "url"
  frigate_topic: "str"
  # Frigate's review-item topic. A review item is Frigate's own grouping of every tracked
  # object on one camera into a single stretch of activity (what its Review page shows);
  # Aviary mirrors each bird review item as one "visit", so a bird that Frigate tracked
  # as a dozen short objects reads as one continuous sighting here, with one notification
  # per species. Must share Frigate's topic_prefix with frigate_topic. Blank disables
  # visits (every Frigate event stays its own card).
  frigate_review_topic: "str?"
  birdnet_topic: "str"
  backfill_on_start: "bool"
  ignore_unclassified: "bool"
  # Frigate camera names whose detections are never recorded (e.g. a wide zone-detection
  # camera whose classifications aren't trustworthy). Empty records every camera.
  ignore_cameras:
    - "str"
  # New species wait in a review queue instead of joining the registry automatically.
  require_species_confirmation: "bool"
  notify_new_species: "bool"
  mqtt_host: "str?"
  mqtt_port: "port"
  mqtt_user: "str?"
  mqtt_password: "password?"
  # Free key from https://xeno-canto.org/account. Optional: without it, reference
  # recordings come from iNaturalist observations as before.
  xeno_canto_api_key: "password?"
  # --- External identification (the aviary-id companion container) -------------
  # Base URL of the aviary-id service, e.g. http://10.0.0.50:8100. It runs on a
  # separate host with a GPU and pulls clips from Frigate itself, so that host needs
  # to reach Frigate — Aviary only sends it the event id.
  identify_url: "url?"
  # Shared secret sent as `Authorization: Bearer ...`; must match AVIARY_ID_TOKEN on
  # the service. Blank means the service is not checking (fine on a trusted LAN).
  identify_token: "password?"
  # Frigate's own bird classification can be on or off alongside this. OFF: every
  # Frigate `bird` event arrives unnamed and Aviary identifies it. ON: Frigate names
  # the bird quickly from its own crop, and aviary-id (0.12.0+) confirms that label
  # from the same crop before it is announced — see identify_confirm_frigate. Events
  # Frigate could not name still get the full identification either way.
  identify_enabled: "bool"
  # Below this fused top-1 probability, a result is treated as unidentified and goes
  # to the review queue instead of the registry.
  identify_min_score: "float(0.0,1.0)"
  # Minimum gap between the top two species. A high score with a tiny margin is two
  # confusable birds (Downy vs. Hairy Woodpecker), not a confident answer.
  identify_min_margin: "float(0.0,1.0)"
  # Concurrent identification requests. The service serializes GPU work anyway, so
  # more than a few only deepens the queue.
  identify_workers: "int(1,8)"
  identify_timeout: "int(5,600)"
  # Unidentified detections are kept for review rather than dropped, then purged
  # after this many days so a busy feeder can't grow the database without bound.
  # 0 keeps them forever.
  identify_retain_days: "int(0,365)"
  # Bias identification toward species BirdNET-Go heard on the microphone around the
  # same time. Costs nothing and uses data Aviary already has.
  identify_use_audio_priors: "bool"
  # Rule blacklisted species out of the identifier's candidate list entirely, so a bird
  # it would have misread as one gets named correctly instead of being discarded. Right
  # when you blacklisted a species because it does not occur here. WRONG if you
  # blacklisted one that genuinely visits and you simply don't want recorded — every
  # visit would then be recorded as some other species. Turn off in that case.
  identify_exclude_blacklisted: "bool"
  # Let the learning probe also learn from the identifier's own confident answers, not
  # only from species you named by hand. Off by default: training on its own unreviewed
  # guesses is how a classifier reinforces its mistakes. Turn on if you rarely label by
  # hand and trust the automatic answers of confirmed species. With
  # identify_confirm_frigate on, a Frigate label the identifier let stand counts as
  # one of its automatic answers.
  identify_learn_from_auto: "bool"
  # A crop this similar (cosine) to one you marked "Not a bird" is set aside — no name, no
  # notification — and listed under Unidentified → Not a bird, where naming it overrules.
  # 0 turns the check off. Lower catches more look-alikes but risks real birds.
  identify_not_bird_similarity: "float(0.0,1.0)?"
  # With Frigate's own bird classification ON, its label is not announced until
  # aviary-id (0.12.0+) has looked at Frigate's crop of the same bird — no clip, so it
  # is quick, and it can only ever be about the bird Frigate tracked. Frigate's label
  # stands unless the birds you have confirmed by hand (the learning probe) say
  # confidently otherwise; then the learned name wins and Frigate's is kept as the
  # runner-up. If aviary-id is unreachable the label is announced as-is. Off = announce
  # Frigate's label at event end, without a second look.
  identify_confirm_frigate: "bool"
  # Frigate tracks one bird's stay as many short objects, and the 2-second fragments it
  # could not name come back from the identifier uncertain. With this on, such a
  # fragment takes the name of a bird already identified in the SAME visit, zone and
  # moment (within identify_visit_window_s seconds) — when that species is on the
  # fragment's own shortlist and no other named species was nearby. Marked "same
  # visit" on the card, never a learning example, never a second notification. Off =
  # every fragment stands or falls on its own footage.
  identify_visit_context: "bool"
  identify_visit_window_s: "float(0.0,300.0)"
  # Frigate's `frigate/tracked_object_update` topic (same topic_prefix as
  # frigate_topic). Only needed if Frigate publishes a bird's classification AFTER the
  # event's end message — watch the topic during a visit before turning this on; the
  # built-in bird classifier normally reports through the events topic itself. Blank
  # leaves it unsubscribed.
  frigate_object_update_topic: "str?"
  # --- Cross-camera zoom --------------------------------------------------------
  # "detect_camera:ptz_camera" pairs. When an event's camera appears on the left, the
  # identification service classifies the RIGHT camera's recordings for the event's time
  # window instead of the event clip — for setups where a wide camera runs detection and
  # a record-only PTZ camera (steered by your automation) holds the zoomed view. The
  # PTZ camera must be recording continuously in Frigate. e.g. ["birdzone:bird"]
  identify_zoom_map:
    - "str"
  # Seconds trimmed from the start of the zoom window, covering PTZ travel time so a
  # leftover view of the previous target is not classified.
  identify_zoom_start_offset: "float(0.0,30.0)"
  # Your PTZ automation's zone priority list, highest first. With two birds in different
  # zones at once, the PTZ parks on the higher-priority zone — so the lower-priority
  # event skips the zoomed footage (it would show the wrong bird) and classifies from
  # its own camera's media. Zones not listed rank below all listed ones. Empty = always
  # use the zoomed footage.
  identify_zoom_zone_priority:
    - "str"
  # Seconds of recordings played before and after a detection when viewing it (the
  # player and the ⇄ other-camera button) and when exporting kept zoomed footage —
  # birds arrive before tracking starts and linger after it ends. Needs the camera's
  # recordings to cover the padding; falls back to the bare event clip when they don't.
  clip_pad_seconds: "float(0.0,300.0)"
  # --- Species keepsakes --------------------------------------------------------
  # Keep the FIRST and the LATEST camera sighting of every species at Frigate: the event
  # is flagged retain_indefinitely so its snapshot and thumbnail never expire, and the
  # species tile always has a picture. "Latest" moves to a newer sighting at most once a
  # day and releases the previous one, so a species never holds more than two events.
  # With require_species_confirmation on, only confirmed species get keepsakes.
  keepsakes: "bool"
  # Also export the padded clip of each keepsake (the event's camera, plus the paired
  # PTZ camera from identify_zoom_map). Frigate's retain flag no longer protects the
  # recording behind a clip — only an export survives retention. A few MB per keepsake;
  # released exports are deleted. Needs Frigate 0.18+.
  keepsake_video: "bool"
  # --- Cleaned BirdNET-Go playback -----------------------------------------------
  # Denoise BirdNET-Go clips when you PLAY them in Aviary. BirdNET-Go still analyses the
  # original audio, iNaturalist uploads stay original, and every card has a Raw toggle to
  # hear the untouched clip. Every preset cuts rumble below 150 Hz and hiss above 12 kHz,
  # then applies wavelet denoising that learns the background as it goes:
  #   smooth   - background about 7 dB quieter between calls; natural, no pumping
  #   balanced - about 11 dB
  #   strong   - about 17 dB, but the noise audibly switches on and off around each
  #              call (a "crunchy" edge)
  #   custom   - your own ffmpeg -af chain in birdnet_clean_filter (blank = smooth)
  #   off      - play the original clips
  # A custom chain ffmpeg rejects plays the original clip and logs ffmpeg's error.
  birdnet_clean_preset: "list(off|smooth|balanced|strong|custom)"
  birdnet_clean_filter: "str?"
  # --- Life list on iNaturalist ---------------------------------------------------
  # Post each species' first sighting to your iNaturalist account, so iNaturalist's Life
  # List is the one place your list lives. Create an application at
  # https://www.inaturalist.org/oauth/applications (tick "Confidential"; the redirect URI
  # can be urn:ietf:wg:oauth:2.0:oob) and fill in all four: iNaturalist's password grant
  # trades your login for a 24-hour API token, and an add-on has no browser to run the
  # interactive flow instead. Never shown in the UI or written to the log. Leave any of
  # them blank to keep the feature off.
  inat_app_id: "str?"
  inat_app_secret: "password?"
  inat_username: "str?"
  inat_password: "password?"
  # Post a species the moment it is confirmed (or first detected, with
  # require_species_confirmation off). Off by default: an observation goes out under YOUR
  # name, and a misidentified bird on iNaturalist is worse than a late one — the species
  # page has a Post button for when you have looked.
  inat_auto_post: "bool"
  # The coordinates are your Home Assistant location, i.e. your house. "obscured" makes
  # iNaturalist show a ~20 km cell instead of the point; observations still count for
  # your life list and can still reach Research Grade. "private" hides the location
  # entirely (and from range maps).
  inat_geoprivacy: "list(open|obscured|private)"
  # Radius in metres iNaturalist records around the coordinates — a yard, not a GPS fix.
  inat_positional_accuracy_m: "int(1,10000)"
  # --- Bird statistics in Home Assistant --------------------------------------------
  # Publish one sensor per confirmed species to Home Assistant over MQTT discovery
  # (state: rarity 0–100; attributes: all-time and recent counts, days active, tier,
  # first/last seen) plus sensor.aviary_ptz_target, which scores every Frigate zone by
  # how rare the bird in it is — so a PTZ automation can point at the rarest bird instead
  # of a fixed zone order. Needs only the MQTT broker Aviary already listens on.
  ha_stats: "bool"
  # Rarity is 100 × (1 − days active ÷ window). A bird seen on 3 of the last 30 days
  # scores 90; one seen every day scores 0. A zone whose bird is not (yet) named scores
  # what its usual visitors score, so a feeder that mostly gets hummingbirds stays low
  # until something else is named there.
  ha_stats_window_days: "int(7,365)"
  # Days behind the "recent" counters on each species sensor (seen_7d, heard_7d, ...).
  ha_stats_recent_days: "int(1,90)"
  # Seconds a zone keeps its last named bird after Frigate's review item closed. Frigate
  # loses and refinds a perched bird as new objects; this keeps the zone scored by that
  # bird across the gap instead of dropping back to the zone's usual visitors.
  ha_stats_zone_memory_s: "int(0,600)"
  # Home Assistant's MQTT discovery prefix. Only change it if you changed it in HA.
  mqtt_discovery_prefix: "str"
  log_level: "list(debug|info|warning|error)"
