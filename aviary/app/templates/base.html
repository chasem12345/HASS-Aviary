<!DOCTYPE html>
{# Theme is stamped server-side so a themed page never flashes the default colours. #}
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aviary{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ u('static', path='/app.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dex-led" aria-hidden="true"></span>🐦 <span>Aviary</span></div>
    <nav>
      <a href="{{ u('dashboard') }}" class="{{ 'active' if page == 'dashboard' }}">Dashboard</a>
      <a href="{{ u('recent') }}" class="{{ 'active' if page == 'recent' }}">Recent</a>
      <a href="{{ u('species_index') }}" class="{{ 'active' if page == 'species' }}">{{ 'Registry' if theme == 'dex' else 'Species' }}</a>
      <a href="{{ u('settings_page') }}" class="{{ 'active' if page == 'settings' }}">Settings</a>
    </nav>
    <button type="button" id="themeToggle" class="theme-toggle"
            data-theme-next="{{ 'auto' if theme == 'dex' else 'dex' }}"
            title="{{ 'Switch back to the standard theme' if theme == 'dex' else 'Switch to Pokedex mode' }}">
      {{ '◉ DEX' if theme == 'dex' else '◌ Dex mode' }}</button>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Ingress-aware URL bases (root-relative; X-Ingress-Path prefix already applied).
    window.AVIARY_BASE = "{{ ingress_path }}";
    window.AVIARY_API = "{{ ingress_path }}/api";
  </script>
  <script src="{{ u('static', path='/chart.umd.js') }}"></script>
  <script src="{{ u('static', path='/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
