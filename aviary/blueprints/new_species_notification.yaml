blueprint:
  name: "Aviary: new species notification"
  description: >
    Notify a phone when Aviary detects a bird species for the first time.
    Triggered by the aviary_new_species event fired by the Aviary add-on.
    This blueprint is installed automatically by the add-on — create an
    automation from it and pick your device.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    notify_device:
      name: Device to notify
      description: Phone or tablet running the Home Assistant Companion app.
      selector:
        device:
          integration: mobile_app
    extra_notify_service:
      name: Additional notify action (optional)
      description: >
        Full name of an extra notify action to also call, e.g.
        notify.all_phones. Leave empty to skip.
      default: ""
      selector:
        text:

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: aviary_new_species

variables:
  # !input can't be used inside Jinja templates, so hoist the inputs first.
  notify_device: !input notify_device
  extra_notify_service: !input extra_notify_service
  title: "New species {{ trigger.event.data.verb | default('seen') }}"
  message: >-
    {{ trigger.event.data.common_name }}{% if trigger.event.data.scientific_name
    %} ({{ trigger.event.data.scientific_name }}){% endif %}
  image: "{{ trigger.event.data.image }}"

actions:
  - action: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
    data:
      title: "{{ title }}"
      message: "{{ message }}"
      # `image` works in both the Android and iOS companion apps; omit when null.
      data: "{{ {'image': image} if image else {} }}"
  - if:
      - condition: template
        value_template: "{{ extra_notify_service | trim != '' }}"
    then:
      - action: "{{ extra_notify_service }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data: "{{ {'image': image} if image else {} }}"
