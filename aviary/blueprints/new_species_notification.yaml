blueprint:
  name: "Aviary: bird notifications"
  description: >
    Bird notifications from the Aviary add-on's aviary_detection events.
    Notifies on new species (seen or heard), on the first time a known species
    is caught on camera or picked up on audio, and optionally on every seen
    (Frigate) and/or heard (BirdNET-Go) detection, with a species blacklist, a
    per-species cooldown, and an optional list of cameras to notify on.
    Tapping a seen-bird notification opens the Frigate
    clip (requires the Frigate integration); a heard-bird notification opens
    the Aviary panel. Pick a companion-app device, a notify group/action, or
    both — at least one is required for anything to happen.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    notify_device:
      name: Device to notify (optional)
      description: >
        Phone or tablet running the Home Assistant Companion app. Optional when
        a notify group/action is set below.
      default: ""
      selector:
        device:
          integration: mobile_app
    extra_notify_service:
      name: Notify group or action (optional)
      description: >
        Full name of any notify action to call instead of (or in addition to)
        the device above, e.g. notify.all_phones. Leave empty to skip.
      default: ""
      selector:
        text:
    notify_new_species:
      name: Always notify on new species
      description: First-ever species notify whether they were seen or heard.
      default: true
      selector:
        boolean:
    notify_all_seen:
      name: Notify on every seen bird
      description: Every Frigate (camera) detection, not just new species.
      default: true
      selector:
        boolean:
    notify_all_heard:
      name: Notify on every heard bird
      description: >
        Every BirdNET-Go (audio) detection, not just new species. Audio
        detections can be frequent — consider the cooldown below.
      default: false
      selector:
        boolean:
    notify_first_seen:
      name: Notify on first sighting
      description: >
        The first time a species is caught on camera, even if you have been
        hearing it for months. Fires once per species. (A brand-new species is
        covered by the new-species toggle above and won't notify twice.)
      default: true
      selector:
        boolean:
    notify_first_heard:
      name: Notify on first recording
      description: >
        The first time a species is picked up on audio, even if the camera has
        seen it before. Fires once per species.
      default: false
      selector:
        boolean:
    cameras:
      name: Cameras to notify on (optional)
      description: >
        Only these Frigate cameras produce notifications — useful when one
        camera does zone detection and another does the actual classifying.
        Leave empty for all cameras. Use the camera's Frigate name exactly as
        it appears on the detection in Aviary (case-insensitive), e.g.
        bird_pole_zoom. Audio (BirdNET-Go) detections are never affected.
      default: []
      selector:
        text:
          multiple: true
    blacklist:
      name: Blacklist (optional)
      description: >
        Species that never notify — not even as a new species. Exact common
        names, case-insensitive (e.g. House Sparrow).
      default: []
      selector:
        text:
          multiple: true
    returning_after_days:
      name: Returning species (days)
      description: >
        A species that has not been detected for at least this many days
        notifies as "Back after N days!" — like a milestone, it fires even
        when routine notifications are off and bypasses the cooldown. A
        long-absent bird showing up again is worth knowing about even on a
        quiet configuration. 0 disables.
      default: 2
      selector:
        number:
          min: 0
          max: 365
          unit_of_measurement: days
          mode: box
    species_cooldown:
      name: Per-species cooldown (minutes)
      description: >
        A species only re-notifies after it has produced no detections OF THE
        SAME KIND for this long — the camera cooldown ignores audio detections
        and vice versa, so a bird singing near the microphone can't suppress
        its camera notifications. Back-to-back cardinals stay silent, a sparrow
        in between still notifies. New-species notifications bypass this.
        0 disables.
      default: 10
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box
    seen_image:
      name: Seen-bird notification image
      description: >
        Image style for camera detections, served live by the Frigate
        integration (always the current event). "Aviary staged image" uses the
        snapshot the add-on saved instead.
      default: "event_preview.gif"
      selector:
        select:
          options:
            - label: Animated preview (GIF)
              value: event_preview.gif
            - label: Snapshot
              value: snapshot.jpg
            - label: Thumbnail
              value: thumbnail.jpg
            - label: Aviary staged image
              value: aviary
    frigate_proxy_base:
      name: Frigate notification proxy base (advanced)
      description: >
        Base path of the Frigate integration's notification proxy, used for the
        seen-bird image and clip tap action. Multi-instance setups use
        /api/frigate/<client_id>/notifications. Clear this to disable both
        (falls back to the Aviary image / panel).
      default: "/api/frigate/notifications"
      selector:
        text:

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: aviary_detection

variables:
  # !input can't be used inside Jinja templates, so hoist the inputs first.
  notify_device: !input notify_device
  extra_notify_service: !input extra_notify_service
  notify_new_species: !input notify_new_species
  notify_all_seen: !input notify_all_seen
  notify_all_heard: !input notify_all_heard
  notify_first_seen: !input notify_first_seen
  notify_first_heard: !input notify_first_heard
  cameras: !input cameras
  blacklist: !input blacklist
  returning_after_days: !input returning_after_days
  species_cooldown: !input species_cooldown
  seen_image: !input seen_image
  frigate_proxy_base: !input frigate_proxy_base
  is_new: "{{ trigger.event.data.is_new_species | default(false) }}"
  verb: "{{ trigger.event.data.verb | default('seen') }}"
  # First time this species has been recorded by this kind of source — the moment a
  # long-heard bird finally shows up on camera, which is_new_species can't express
  # because it means "never detected at all". `default(false, true)` also covers events
  # from add-on builds before 0.11.0, where the fields simply don't exist.
  is_first_seen: "{{ trigger.event.data.is_first_seen | default(false, true) }}"
  is_first_heard: "{{ trigger.event.data.is_first_heard | default(false, true) }}"
# Cooldown counts only detections of the same kind (seen vs heard), so audio
  # chatter never suppresses camera notifications. Falls back to the any-source
  # gap for events from add-on versions before 0.4.2. (Defined before `milestone`,
  # which now depends on it via `returning`.)
  since_last: >-
    {{ (trigger.event.data.seconds_since_species_last_seen
        | default(trigger.event.data.seconds_since_species_last_detected))
       if verb == 'seen' else
       (trigger.event.data.seconds_since_species_last_heard
        | default(trigger.event.data.seconds_since_species_last_detected)) }}
  # A species back after a long absence. Uses the ANY-source gap, not the per-kind one
  # the cooldown uses: a bird heard yesterday but photographed today has not "returned".
  # Excludes brand-new species (they have their own, stronger announcement).
  since_any: >-
    {{ trigger.event.data.seconds_since_species_last_detected | default(none, true) }}
  returning: >-
    {{ not is_new and (returning_after_days | default(0) | float(0)) > 0
       and since_any not in (none, '')
       and (since_any | float(0)) >= (returning_after_days | float(0)) * 86400 }}
  returning_days: "{{ ((since_any | float(0)) / 86400) | int }}"
  milestone: >-
    {{ (is_first_seen and notify_first_seen) or (is_first_heard and notify_first_heard)
       or returning }}
  blacklisted: >-
    {{ trigger.event.data.common_name | lower
       in (blacklist | default([]) | map('lower') | list) }}
  # Seen-only: BirdNET-Go puts a node name in `location`, so applying a camera
  # allowlist to heard detections would silence every audio notification. A seen
  # detection with no location fails the check — an unverifiable camera isn't
  # assumed to be an allowed one.
  camera_ok: >-
    {{ verb != 'seen' or (cameras | default([]) | length) == 0
       or (trigger.event.data.location | default('', true) | lower)
          in (cameras | map('lower') | list) }}
  passes_toggle: >-
    {{ (is_new and notify_new_species)
       or milestone
       or (verb == 'seen' and notify_all_seen)
       or (verb == 'heard' and notify_all_heard) }}
  # Milestones bypass the cooldown alongside new species: a once-ever event must never be
  # swallowed because the same bird happened to be around a few minutes ago.
  passes_cooldown: >-
    {{ is_new or milestone or (species_cooldown | default(0)) == 0
       or since_last in (none, '')
       or (since_last | float(0)) >= (species_cooldown | float(0)) * 60 }}
  # e.g. "Northern Cardinal detected at bird bath" (zone), "…detected on bird camera"
  # (no zone) / "Wood Thrush heard at yard". Prefixed for milestones (notifications have
  # no title), most significant first: a brand-new species reads "New species!" even
  # though its first_seen flag is also set. The zone is preferred over the camera — it
  # says WHERE in the yard, which is the interesting part; underscores read as spaces.
  message: >-
    {{ 'New species! ' if is_new
       else ('First sighting! ' if is_first_seen
             else ('First recording! ' if is_first_heard
                   else ('Back after ' ~ returning_days ~ ' days! ' if returning else ''))) }}{{ trigger.event.data.common_name }}
    {%- if verb == 'seen' %} detected
    {%- if trigger.event.data.zone %} at
    {{ trigger.event.data.zone | replace('_', ' ') }}
    {%- elif trigger.event.data.location %} on
    {{ trigger.event.data.location }} camera{% endif %}
    {%- else %} heard{% if trigger.event.data.location %} at
    {{ trigger.event.data.location }}{% endif %}{% endif %}
  # Seen birds: live image from the Frigate integration (current event, never a
  # stale cache). Everything else: the image the add-on staged under /local.
  image: >-
    {%- if verb == 'seen' and seen_image != 'aviary'
          and (frigate_proxy_base | trim) != '' and trigger.event.data.source_ref
    -%}{{ frigate_proxy_base | trim }}/{{ trigger.event.data.source_ref }}/{{ seen_image }}
    {%- else -%}{{ trigger.event.data.image | default('', true) }}{%- endif -%}
  # Tap action: seen -> the Frigate clip; heard -> the Aviary panel.
  tap_url: >-
    {% if verb == 'seen' and (frigate_proxy_base | trim) != '' and
          trigger.event.data.source_ref %}{{ frigate_proxy_base | trim
    }}/{{ trigger.event.data.source_ref }}/clip.mp4{% else %}{{
    trigger.event.data.panel_path | default('', true) }}{% endif %}
  # clickAction = Android, url = iOS; each platform ignores the other's key.
  notify_data: >-
    {% if image and tap_url %}{{ {'image': image, 'clickAction': tap_url, 'url': tap_url} }}
    {%- elif image %}{{ {'image': image} }}
    {%- elif tap_url %}{{ {'clickAction': tap_url, 'url': tap_url} }}
    {%- else %}{{ {} }}{% endif %}

conditions:
  - condition: template
    value_template: "{{ not blacklisted and camera_ok and passes_toggle and passes_cooldown }}"

actions:
  - if:
      - condition: template
        # A cleared device picker can submit null (not just omit the key), so
        # check for both none and empty string.
        value_template: "{{ notify_device not in (none, '') }}"
    then:
      - action: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
        data:
          message: "{{ message }}"
          data: "{{ notify_data }}"
  - if:
      - condition: template
        value_template: "{{ extra_notify_service | trim != '' }}"
    then:
      - action: "{{ extra_notify_service }}"
        data:
          message: "{{ message }}"
          data: "{{ notify_data }}"
